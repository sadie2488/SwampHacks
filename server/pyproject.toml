[project]
name = "swamphacks-server"
version = "0.0.0"
description = "Server for the SwampHacks music app: upload, analysis, feedback, and the database."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "jsonschema>=4.22"]
# Heavy audio libraries. Not installed in CI; install with: uv sync --group analysis
analysis = ["librosa>=0.10", "soundfile>=0.12", "numpy>=1.26", "music21>=9"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["app", "analysis", "feedback"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
