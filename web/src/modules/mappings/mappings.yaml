# MAPPINGS: the rules that connect what the app senses to what it does to the music.
# This file is Veda's. Change anything in it. Save the file and the app picks it up instantly (no restart, no reload).
#
# Every rule says, in plain words:
#     "When [signal] happens in [mode], do [control], [this way]."
#
#   name            any label you like (it shows up in the Command Lab)
#   mode            play | create | learn | any     (any = in every mode)
#   when            what the app senses            list: contracts/signal-catalog.json
#   do              what gets changed              list: contracts/control-catalog.json
#   how             follow  = the control follows a slider signal (hand goes up -> tempo goes up)
#                   trigger = fires once per moment (double clap -> play/pause)
#                   toggle  = flips something on/off
#                   nudge   = moves a control one step (say "faster" -> tempo +0.1)
#
# Optional fine-tuning:
#   range           [low, high] how far a follow rule moves the control; [1.0, 0.5] runs backwards
#   smoothing       0 = jumpy ... 1 = very smooth (steadies shaky hand tracking)
#   min_confidence  0 to 1: ignore readings the app is not sure about
#   cooldown_ms     ignore repeats for this long (stops one clap counting twice)
#   only_while      a held gesture (like a fist) that must be active for the rule to work
#   step            how far one nudge moves (negative = down)
#   value           the fixed value a trigger sets
#   hold_ms         hold the gesture this long (ms) before the rule fires; a ring fills while you hold
#   enabled         false = switch the rule off without deleting it
#
# A typo never breaks the app: that one rule is skipped and the Command Lab explains what to fix.
# The Command Lab (the test page) shows every signal and control name, and lights up each rule when it fires.
# Full guide: docs/commands-guide.md

# --- Play mode ---------------------------------------------------------------------------------------------------

# Sat-night fix: this rule now eases in from the current tempo, ignores wobbles under 0.02x,
# and pauses while a practice run is listening (any tempo change would end the run early).
- name: hand height controls tempo
  mode: play
  when: vision.hand.right.height
  do: playback.tempo
  how: follow
  range: [0.5, 1.5]
  smoothing: 0.3
  min_confidence: 0.6

- name: head tilt slows down        # switched off: it would fight with the hand-height rule above
  enabled: false
  mode: play
  when: vision.head.tilt
  do: playback.tempo
  how: follow
  range: [1.0, 0.5]
  smoothing: 0.5

# A DOUBLE clap, not one: single clap-like sounds (desk taps, keys, the song's own drums) happen by accident and would start and stop the music.
- name: clap toggles play/pause
  mode: play
  when: audio.clap.double
  do: playback.toggle
  how: trigger
  cooldown_ms: 800

# Voice commands only work while the left fist is held, so the instrument you are playing does not set them off.

- name: say "pause" only while left fist is held
  mode: play
  when: audio.keyword.pause
  only_while: vision.hand.left.fist
  do: playback.pause
  how: trigger

- name: say "play" only while left fist is held
  mode: play
  when: audio.keyword.play
  only_while: vision.hand.left.fist
  do: playback.play
  how: trigger

- name: say "slower" only while left fist is held
  mode: play
  when: audio.keyword.slower
  only_while: vision.hand.left.fist
  do: playback.tempo
  how: nudge
  step: -0.1

- name: say "faster" only while left fist is held
  mode: play
  when: audio.keyword.faster
  only_while: vision.hand.left.fist
  do: playback.tempo
  how: nudge
  step: 0.1

- name: say "higher" only while left fist is held
  mode: play
  when: audio.keyword.higher
  only_while: vision.hand.left.fist
  do: playback.pitch
  how: nudge
  step: 1

- name: say "lower" only while left fist is held
  mode: play
  when: audio.keyword.lower
  only_while: vision.hand.left.fist
  do: playback.pitch
  how: nudge
  step: -1

# --- Create mode -------------------------------------------------------------------------------------------------

- name: right hand height pitches the enabled layer
  mode: create
  when: vision.hand.right.height
  do: create.layer.pitch
  how: follow
  range: [-6, 6]
  smoothing: 0.4
  min_confidence: 0.6

- name: start begins recording a layer
  mode: create
  when: audio.keyword.start
  do: create.loop.record
  how: trigger
  value: true

- name: raised left fist ends the current take
  mode: create
  when: vision.hand.left.raised
  only_while: vision.hand.left.fist
  do: create.loop.record
  how: trigger
  value: false

- name: fist closes while raised ends the current take
  mode: create
  when: vision.hand.left.fist
  only_while: vision.hand.left.raised
  do: create.loop.record
  how: trigger
  value: false

- name: right hand position controls layer volume
  mode: create
  when: vision.hand.right.x
  do: create.layer.volume
  how: follow
  range: [0, 1]
  smoothing: 0.35
  min_confidence: 0.6

- name: left thumbs-up keeps the current pitch
  mode: create
  when: vision.hand.left.thumbs_up
  do: create.layer.confirm_pitch
  how: trigger

- name: say next to record another layer
  mode: create
  when: audio.keyword.next
  do: create.layer.next
  how: trigger

- name: say piano for this layer
  mode: create
  when: audio.keyword.piano
  do: create.instrument
  how: trigger
  value: piano

- name: say synth for this layer
  mode: create
  when: audio.keyword.synth
  do: create.instrument
  how: trigger
  value: synth

- name: say bass for this layer
  mode: create
  when: audio.keyword.bass
  do: create.instrument
  how: trigger
  value: bass

- name: say pluck for this layer
  mode: create
  when: audio.keyword.pluck
  do: create.instrument
  how: trigger
  value: pluck

- name: say drums for this layer
  mode: create
  when: audio.keyword.drums
  do: create.instrument
  how: trigger
  value: drums

- name: say none for this layer
  mode: create
  when: audio.keyword.none
  do: create.effects
  how: trigger
  value: none

- name: say reverb for this layer
  mode: create
  when: audio.keyword.reverb
  do: create.effects
  how: trigger
  value: reverb

- name: say delay for this layer
  mode: create
  when: audio.keyword.delay
  do: create.effects
  how: trigger
  value: delay

- name: say filter for this layer
  mode: create
  when: audio.keyword.filter
  do: create.effects
  how: trigger
  value: filter

- name: say beat to turn on the beat
  mode: create
  when: audio.keyword.beat
  do: create.beat
  how: trigger
  value: true

- name: right fist finishes the composition
  mode: create
  when: vision.hand.right.fist
  do: create.loop.stop
  how: trigger


# --- Any mode: Lalitha's sign shortcuts ----------------------------------------------------------------------------
# Hold a fingerspelled letter for 2 seconds to jump to a mode. A ring fills around it while you hold; let go early
# and nothing happens. L = Learn, Y = Play, C = Create, W = Command Lab. Change the letters or hold time freely.

- name: hold L to go to Learn        # switched off Sun 5:30 AM (Lalitha): modes are chosen on the record menu, not with ASL
  enabled: false
  mode: any
  when: vision.sign.l
  do: app.mode
  how: trigger
  value: learn
  hold_ms: 2000

- name: hold Y to go to Play        # switched off Sun 5:30 AM (Lalitha): modes are chosen on the record menu, not with ASL
  enabled: false
  mode: any
  when: vision.sign.y
  do: app.mode
  how: trigger
  value: play
  hold_ms: 2000

- name: hold C to go to Create        # switched off Sun 5:30 AM (Lalitha): modes are chosen on the record menu, not with ASL
  enabled: false
  mode: any
  when: vision.sign.c
  do: app.mode
  how: trigger
  value: create
  hold_ms: 2000

- name: hold W to go to the Command Lab        # switched off Sun 5:30 AM (Lalitha): modes are chosen on the record menu, not with ASL
  enabled: false
  mode: any
  when: vision.sign.w
  do: app.mode
  how: trigger
  value: lab
  hold_ms: 2000

# The two "grab to enter the chosen record" rules were removed: the hand cursor's hold-to-click on a record replaces them.
